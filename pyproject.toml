[build-system]
requires = [
    "setuptools>=60.0",
    "wheel",
    "cython>=3.0.0",
    "numpy>=1.26.4",
    "pybind11[global]>=2.10.0",
    "cmake>=3.20.0"
]
build-backend = "setuptools.build_meta"

[project]
# name = "genesis-world-nightly"
# version = "0.0.3"
name = "genesis-world"
version = "0.2.1"
description = "A universal and generative physics engine"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "psutil",
    "taichi >= 1.7.2",
    "pydantic >= 2.7.1",
    "numpy >= 1.26.4",
    "trimesh",
    "scipy >= 1.14",
    "libigl",
    # Cross-platform library to get various kind of CPU information such as model name
    "py-cpuinfo",
    # * Mujoco 3.3 made Native CCD an opt-out option instead of opt-in,
    #   which requires setting the disableflags 'mjDSBL_NATIVECCD'.
    "mujoco >= 3.3.0, < 3.4.0",
    "moviepy >= 2.0.0",
    # Used by `pyrender` to manage onscreen graphical windows
    "pyglet>=1.5",
    # Used by `pyrender` to load fonts
    "freetype-py",
    # Used by `pyrender` to write low-level OpenGL rendering pipeline
    "PyOpenGL>=3.1.4",
    # Use by `pyrender` to compile low-level OpenGL rendering pipeline
    "numba",
    # Use by `Mesh.remesh`, which is involve in `PBDTetEntity.sample`
    "pymeshlab",
    # Optional `trimesh` dependency for loading `.dae` mesh files
    "pycollada",
    # Used for parsing `.glb` mesh files
    "pygltflib == 1.16.0",
    # Used for parsing `.usd` mesh files
    "usd-core",
    # Use by `PBD3DEntity.sample` to tetrahedralize a mesh
    "tetgen >= 0.6.4",
    # Used for some advanced mesh processing such as `skeletonization`
    "PyGEL3D",
    # Use to display camera images
    "opencv-python",
    # Use by `RigidGeom.visualize_sdf` to render SDF as level 0 marching cubes
    "scikit-image",
    # Convex decomposition library
    "coacd",
    # Ray casting used in mesh to height field conversion
    "rtree",
    # Constraint Satisfaction Solver.
    # Used to compute contype and conaffinity bitmasks from complete list of excluded collision pairs.
    "z3-solver",
    # Used for loading raytracing special texture images used by LuisaRender
    "OpenEXR",
    # Motion Planning library
    # * 1.7.0: First version distributed on PyPI (no pre-compiled binaries for Windows OS).
    #          Fix OMPL DLL search directory.
    "ompl>=1.7.0; platform_system != 'Windows'"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["genesis", "genesis.*"]

[tool.setuptools.package-data]
genesis = [
    "assets/*",
    "ext/pyrender/fonts/*",
    "ext/pyrender/shaders/*",
    "ext/VolumeSampling",
]

[tool.black]
line-length = 120
force-exclude = '''
/(
    genesis/ext
)/
'''

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
    "--pdbcls=IPython.terminal.debugger:TerminalPdb",
    # "--exitfirst",
    "--numprocesses=auto",
    "--dist=worksteal",
    "--random-order-bucket=global",
    "--random-order-seed=0",
    "--max-worker-restart=0",
    "--durations=0",
    "--durations-min=40.0",
    "-m not benchmarks",
]
filterwarnings = [
    "ignore::_pytest.warning_types.PytestUnknownMarkWarning",
    "ignore::DeprecationWarning",
]
markers = [
    "benchmarks: marks benchmarks (executed independently and sequentially).",
    "required: marks minimal test set that must pass systematically on any environment before merging.",
]
log_cli_level = "WARNING"

[project.scripts]
gs = "genesis._main:main"

[project.optional-dependencies]
# Navi Gym specific dependencies
navi = [
    "py-cpuinfo>=9.0.0",
    "glfw>=2.9.0",
    "aiohappyeyeballs>=2.6.1",
    "aiosignal>=1.4.0",
    "annotated-types>=0.7.0",
    "anyio>=4.9.0",
    "attrs>=25.3.0",
    "audioread>=3.0.1",
    "cffi>=1.17.1",
    "cloudpickle>=3.1.1",
    "contourpy>=1.3.2",
    "cycler>=0.12.1",
    "decorator>=5.2.1",
    "farama-notifications>=0.0.4",
    "fonttools>=4.58.5",
    "frozenlist>=1.7.0",
    "fsspec>=2025.5.1",
    "h11>=0.16.0",
    "idna>=3.10",
    "iniconfig>=2.1.0",
    "jinja2>=3.1.6",
    "joblib>=1.5.1",
    "kiwisolver>=1.4.8",
    "lazy-loader>=0.4",
    "llvmlite>=0.44.0",
    "markdown-it-py>=3.0.0",
    "mccabe>=0.7.0",
    "mdurl>=0.1.2",
    "mpmath>=1.3.0",
    "msgpack>=1.1.1",
    "multidict>=6.6.3",
    "mypy-extensions>=1.1.0",
    "networkx>=3.5",
    "packaging>=25.0",
    "pandas>=2.3.0",
    "pathspec>=0.12.1",
    "platformdirs>=4.3.8",
    "pluggy>=1.6.0",
    "pooch>=1.8.2",
    "propcache>=0.3.2",
    "pycparser>=2.22",
    "pydantic-core>=2.18.0",
    "pyflakes>=3.4.0",
    "pyparsing>=3.2.3",
    "pytest-asyncio>=1.0.0",
    "python-dateutil>=2.9.0",
    "pytz>=2025.2",
    "requests>=2.32.4",
    "six>=1.17.0",
    "sniffio>=1.3.1",
    "soxr>=0.5.0",
    "starlette>=0.46.2",
    "sympy>=1.14.0",
    "threadpoolctl>=3.6.0",
    "triton>=3.3.1",
    "typing-extensions>=4.14.1",
    "tzdata>=2025.2",
    "urllib3>=2.5.0",
    "yarl>=1.20.1",
    "certifi>=2025.6.15",
    "charset-normalizer>=3.4.2",
    "MarkupSafe>=3.0.2",
]
dev = [
    "black",
    "pytest",
    "pytest-xdist",
    "pytest-forked",
    "pytest-random-order",
    "pytest-print",
    "pytest-rerunfailures",
    "huggingface_hub",
    "wandb",
]
docs = [
    # Note that currently sphinx 7 does not work, so we must use v6.2.1. See https://github.com/kivy/kivy/issues/8230 which tracks this issue. Once fixed we can use a later version
    "sphinx==6.2.1",
    "sphinx-autobuild",
    "pydata_sphinx_theme",
    # For spelling
    "sphinxcontrib.spelling",
    # Type hints support
    "sphinx-autodoc-typehints",
    # Copy button for code snippets
    "sphinx_copybutton",
    # Markdown parser
    "myst-parser",
    "sphinx-subfigure",
    "sphinxcontrib-video",
    "sphinx-togglebutton",
    "sphinx_design",
]
render = [
    "pybind11[global]",
    "open3d",
]
