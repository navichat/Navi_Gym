name: ARM64 CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Test suite to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - unit
          - integration
          - smoke

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PYTHON_VERSION: 3.11

jobs:
  # ARM64 specific builds and tests
  arm64-build-test:
    runs-on: [self-hosted, linux, arm64, navi-gym]
    if: contains(github.event.head_commit.message, '[arm64]') || github.event_name == 'workflow_dispatch'
    
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ARM64 Docker image
        run: |
          echo "Building ARM64 Docker image..."
          docker build -f docker/Dockerfile \
            --platform linux/arm64 \
            --build-arg PYTHON_VERSION=${{ env.PYTHON_VERSION }} \
            -t navi-gym:arm64-latest \
            -t navi-gym:arm64-${{ github.run_number }} \
            .

      - name: Test ARM64 image basic functionality
        run: |
          echo "Testing ARM64 image functionality..."
          docker run --rm --platform linux/arm64 navi-gym:arm64-latest python -c "
          import sys
          import platform
          print(f'Python version: {sys.version}')
          print(f'Architecture: {platform.machine()}')
          print(f'Platform: {platform.platform()}')
          
          # Test core dependencies
          try:
              import numpy as np
              import torch
              import scipy
              print('✓ Core dependencies imported successfully')
              
              # Test ARM64 specific optimizations
              print(f'NumPy BLAS info: {np.__config__.show()}')
              print(f'PyTorch build info: {torch.version.cuda if torch.cuda.is_available() else \"CPU-only\"}')
              
          except ImportError as e:
              print(f'✗ Core import failed: {e}')
              sys.exit(1)
          
          # Test Genesis import
          try:
              import genesis as gs
              print('✓ Genesis imported successfully on ARM64')
          except ImportError as e:
              print(f'⚠ Genesis import failed: {e}')
          
          print('✓ ARM64 smoke test completed successfully')
          "

      - name: Run ARM64 specific tests
        run: |
          echo "Running ARM64 optimized tests..."
          
          # Set test suite based on input or default
          TEST_SUITE="${{ github.event.inputs.test_suite || 'smoke' }}"
          echo "Running test suite: $TEST_SUITE"
          
          # Create test output directory
          mkdir -p test-results-arm64
          
          docker run --rm \
            --platform linux/arm64 \
            -v $(pwd):/workspace/navi-gym \
            -v $(pwd)/test-results-arm64:/test-results \
            -w /workspace/navi-gym \
            -e PYTHONPATH=/workspace/navi-gym \
            -e DISPLAY=:99 \
            -e PYOPENGL_PLATFORM=osmesa \
            -e TI_ENABLE_CUDA=0 \
            -e TI_ENABLE_OPENGL=0 \
            -e TI_ENABLE_VULKAN=0 \
            navi-gym:arm64-latest \
            bash -c "
              echo 'Running $TEST_SUITE tests on ARM64...'
              
              case '$TEST_SUITE' in
                'smoke')
                  python -c 'import numpy, torch, scipy; print(\"✓ ARM64 smoke test passed\")'
                  ;;
                'unit')
                  python -m pytest tests/ -x --tb=short --junit-xml=/test-results/arm64-unit-results.xml -v
                  ;;
                'integration')
                  python -m pytest tests/ -m 'not benchmarks' --tb=short --junit-xml=/test-results/arm64-integration-results.xml -v
                  ;;
                'all')
                  python -m pytest tests/ --tb=short --junit-xml=/test-results/arm64-all-results.xml -v
                  ;;
              esac
            "

      - name: Upload ARM64 test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm64-test-results
          path: test-results-arm64/
          retention-days: 7

      - name: Performance comparison
        run: |
          echo "Running ARM64 performance tests..."
          docker run --rm --platform linux/arm64 navi-gym:arm64-latest python -c "
          import time
          import numpy as np
          import torch
          
          print('=== ARM64 Performance Metrics ===')
          
          # NumPy performance test
          start_time = time.time()
          a = np.random.random((1000, 1000))
          b = np.random.random((1000, 1000))
          c = np.dot(a, b)
          numpy_time = time.time() - start_time
          print(f'NumPy 1000x1000 matrix multiplication: {numpy_time:.4f}s')
          
          # PyTorch performance test
          start_time = time.time()
          x = torch.randn(1000, 1000)
          y = torch.randn(1000, 1000)
          z = torch.mm(x, y)
          torch_time = time.time() - start_time
          print(f'PyTorch 1000x1000 matrix multiplication: {torch_time:.4f}s')
          
          print(f'Performance ratio (torch/numpy): {torch_time/numpy_time:.2f}')
          "

      - name: Push ARM64 image
        if: github.event_name != 'pull_request'
        run: |
          echo "Pushing ARM64 image to registry..."
          docker tag navi-gym:arm64-latest ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:arm64-latest
          docker tag navi-gym:arm64-${{ github.run_number }} ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:arm64-${{ github.run_number }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:arm64-latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:arm64-${{ github.run_number }}

  # ARM64 deployment readiness
  arm64-deployment-check:
    runs-on: [self-hosted, linux, arm64, navi-gym]
    needs: arm64-build-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: ARM64 deployment validation
        run: |
          echo "Validating ARM64 deployment readiness..."
          
          # Test container lifecycle
          CONTAINER_ID=$(docker run -d --platform linux/arm64 navi-gym:arm64-latest sleep 30)
          sleep 5
          docker stop $CONTAINER_ID
          docker wait $CONTAINER_ID
          echo "✓ ARM64 container lifecycle test passed"
          
          # Test resource constraints
          docker run --rm --platform linux/arm64 --memory=1g --cpus=1 navi-gym:arm64-latest python -c "
          import psutil
          import platform
          print(f'Architecture: {platform.machine()}')
          print(f'Available memory: {psutil.virtual_memory().available / (1024**3):.2f} GB')
          print('✓ ARM64 resource constraint test passed')
          "

      - name: Generate ARM64 deployment report
        run: |
          echo "# ARM64 Deployment Report" > arm64-deployment-report.md
          echo "**Date:** $(date)" >> arm64-deployment-report.md
          echo "**Architecture:** ARM64 (aarch64)" >> arm64-deployment-report.md
          echo "**Commit:** ${{ github.sha }}" >> arm64-deployment-report.md
          echo "**Branch:** ${{ github.ref_name }}" >> arm64-deployment-report.md
          echo "" >> arm64-deployment-report.md
          echo "## ARM64 Status" >> arm64-deployment-report.md
          echo "✅ ARM64 Docker build successful" >> arm64-deployment-report.md
          echo "✅ ARM64 tests passed" >> arm64-deployment-report.md
          echo "✅ ARM64 performance validated" >> arm64-deployment-report.md
          echo "✅ ARM64 deployment ready" >> arm64-deployment-report.md

      - name: Upload ARM64 deployment report
        uses: actions/upload-artifact@v4
        with:
          name: arm64-deployment-report
          path: arm64-deployment-report.md
          retention-days: 30