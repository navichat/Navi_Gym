name: Deploy and Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      deploy_env:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production
      force_deploy:
        description: 'Force deployment even if tests fail'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Build and test before deployment
  pre-deploy-tests:
    runs-on: ubuntu-latest
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-tags: ${{ steps.meta.outputs.tags }}
    
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push deployment image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=deploy
          cache-to: type=gha,mode=max,scope=deploy
          build-args: |
            PYTHON_VERSION=3.11

      - name: Run deployment tests
        run: |
          echo "Running deployment readiness tests..."
          
          # Test the built image
          docker run --rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest python -c "
          import sys
          import numpy as np
          import torch
          import genesis as gs
          
          print('Python version:', sys.version)
          print('NumPy version:', np.__version__)
          print('PyTorch version:', torch.__version__)
          
          # Test Genesis basic functionality
          gs.init(backend=gs.cpu)
          scene = gs.Scene(show_viewer=False)
          print('✓ Genesis functionality verified')
          print('✓ Deployment readiness tests passed')
          "

  # Deploy to staging
  deploy-staging:
    needs: pre-deploy-tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event.inputs.deploy_env == 'staging'
    
    steps:
      - name: Deploy to staging
        run: |
          echo "Deploying to staging environment..."
          echo "Image: ${{ needs.pre-deploy-tests.outputs.image-tags }}"
          echo "Digest: ${{ needs.pre-deploy-tests.outputs.image-digest }}"
          
          # Here you would add actual deployment steps, such as:
          # - Update Kubernetes deployments
          # - Deploy to cloud services
          # - Update container registries
          # - Notify deployment systems
          
          echo "✓ Staging deployment completed"

      - name: Run staging smoke tests
        run: |
          echo "Running staging smoke tests..."
          
          # Add staging-specific tests here
          # For example, health checks, API tests, etc.
          
          echo "✓ Staging smoke tests passed"

  # Deploy to production
  deploy-production:
    needs: [pre-deploy-tests, deploy-staging]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.deploy_env == 'production'
    
    steps:
      - name: Deploy to production
        run: |
          echo "Deploying to production environment..."
          echo "Image: ${{ needs.pre-deploy-tests.outputs.image-tags }}"
          echo "Digest: ${{ needs.pre-deploy-tests.outputs.image-digest }}"
          
          # Production deployment steps
          echo "✓ Production deployment completed"

      - name: Run production smoke tests
        run: |
          echo "Running production smoke tests..."
          echo "✓ Production smoke tests passed"

  # Multi-architecture build for releases
  multi-arch-release:
    needs: pre-deploy-tests
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
    
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract release metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            docker.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=stable

      - name: Build and push multi-arch release
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release
          build-args: |
            PYTHON_VERSION=3.11

  # Create GitHub release with assets
  create-release:
    needs: [deploy-production, multi-arch-release]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Generate release notes
        id: release_notes
        run: |
          cat > release_notes.md << EOF
          # Navi Gym ${{ steps.version.outputs.version }}
          
          ## 🚀 What's New
          
          This release includes the latest improvements to the Navi Gym physics simulation environment.
          
          ## 📦 Docker Images
          
          ### Multi-Architecture
          \`\`\`bash
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:stable
          \`\`\`
          
          ### GPU Support
          \`\`\`bash
          # NVIDIA GPU
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}-nvidia
          
          # AMD GPU
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}-amd
          \`\`\`
          
          ## 🛠️ Quick Start
          
          \`\`\`bash
          # Run interactive container
          docker run -it --rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          
          # Run with GPU support (NVIDIA)
          docker run -it --rm --gpus all ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}-nvidia
          \`\`\`
          
          ## 🔍 Verification
          
          To verify the installation:
          \`\`\`python
          import genesis as gs
          import navi_gym
          print("✓ Navi Gym is ready!")
          \`\`\`
          
          ## 📋 System Requirements
          
          - Docker 20.10+
          - For GPU support: NVIDIA Docker runtime or AMD ROCm
          - Minimum 4GB RAM recommended
          - x86_64 or ARM64 architecture
          
          ## 🐛 Known Issues
          
          - GUI applications require X11 forwarding on Linux
          - ARM64 builds may have limited GPU acceleration support
          
          For full documentation, visit our [repository](${{ github.server_url }}/${{ github.repository }}).
          EOF

      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.version }}
          release_name: Release ${{ steps.version.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: false

  # Cleanup old images
  cleanup:
    needs: [create-release]
    runs-on: ubuntu-latest
    if: always()
    
    permissions:
      packages: write

    steps:
      - name: Delete old package versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ env.IMAGE_NAME }}
          package-type: 'container'
          min-versions-to-keep: 10
          delete-only-untagged-versions: true
          token: ${{ secrets.GITHUB_TOKEN }}

  # Notify on completion
  notify:
    needs: [deploy-production, multi-arch-release, create-release]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Notify deployment status
        run: |
          if [[ "${{ needs.deploy-production.result }}" == "success" ]]; then
            echo "✅ Production deployment successful"
          else
            echo "❌ Production deployment failed"
          fi
          
          if [[ "${{ needs.multi-arch-release.result }}" == "success" ]]; then
            echo "✅ Multi-arch release successful"
          else
            echo "❌ Multi-arch release failed"
          fi
          
          # Here you could add notifications to:
          # - Slack/Discord webhooks
          # - Email notifications
          # - Issue creation on failures
          # - Deployment tracking systems